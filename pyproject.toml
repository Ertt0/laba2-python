
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "labs"
version = "0.1.0"
description = "Stream statistics analyzer"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.14.1",
    "pytest>=8.4.2",
    "typer>=0.27.3",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "ruff>=0.6.0",
    "mypy>=1.10",
]